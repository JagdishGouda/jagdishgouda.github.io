<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Dr. Jagdish Gouda | Pavement Geotechnics & Research Portfolio</title>
    <meta
      name="title"
      content="Dr. Jagdish Gouda | Pavement Geotechnics & Research Portfolio"
    />
    <meta
      name="description"
      content="Academic & Research Portfolio of Dr. Jagdish Gouda specializing in pavement geotechnics, low-carbon binders, and mine overburden recycling."
    />
    <meta
      name="keywords"
      content="Jagdish Gouda, Pavement Geotechnics, Mine Overburden, Geocells, VNIT Nagpur, Civil Engineering, Low-Carbon Binders"
    />
    <meta name="author" content="Dr. Jagdish Gouda" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://jagdishgouda.github.io/" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jagdishgouda.github.io/" />
    <meta
      property="og:title"
      content="Dr. Jagdish Gouda — Academic & Research Portfolio"
    />
    <meta
      property="og:description"
      content="Research impact, publications, and scientific contributions in pavement geotechnics and circular economy solutions."
    />
    <meta
      property="og:image"
      content="https://jagdishgouda.github.io/assets/profile.jpg"
    />

    <!-- Academic / Google Scholar Meta Tags -->
    <meta name="citation_author" content="Gouda, Jagdish" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- STICKY NAVBAR -->
    <nav class="sticky-nav" id="sticky-nav">
      <div class="nav-content">
        <span class="nav-name">Dr. Jagdish Gouda</span>
        <div class="nav-links">
          <a href="#overview">Overview</a>
          <a href="#trajectory">Trajectory</a>
          <a href="#publications">Research</a>
        </div>
      </div>
    </nav>

    <div class="layout-wrapper">
      <!-- HEADER -->
      <header class="profile-header">
        <a
          href="assets/Jagdish_CV.pdf"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-top-right-cv"
        >
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M10 12a1 1 0 01-.707-.293l-4-4a1 1 0 111.414-1.414L9 8.586V3a1 1 0 012 0v5.586l2.293-2.293a1 1 0 111.414 1.414l-4 4A1 1 0 0110 12z"
            />
            <path d="M3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" />
          </svg>
          Curriculum Vitae
        </a>
        <div class="avatar-container">
          <img
            src="assets/profile.jpg"
            alt="Dr. Jagdish Gouda"
            class="avatar"
            onerror="
              this.src = 'https://via.placeholder.com/124/E7E5E4/57534E?text=JG'
            "
          />
        </div>
        <div class="header-details">
          <h1 id="sidebar-name"></h1>

          <p class="sidebar-title" id="sidebar-title"></p>
          <p class="sidebar-affil" id="sidebar-affil"></p>

          <div class="meta-bar">
            <div>
              <a id="email-link" class="contact-link"></a>
              <span id="phone-text" class="sub-contact"></span>
            </div>
            <div class="profile-links" id="profile-links"></div>
          </div>
        </div>
      </header>

      <!-- QUICK STATS -->
      <section class="stats-strip">
        <div class="stat-item">
          <span class="stat-value">14</span>
          <span class="stat-label">Publications</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">4.1</span>
          <span class="stat-label">Max Impact Factor</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">3+</span>
          <span class="stat-label">Consultancy Audits</span>
        </div>
      </section>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <!-- Overview -->
        <section class="content-block" id="overview">
          <h2 class="block-label">Overview</h2>
          <p class="narrative-text" id="narrative-about"></p>
          <div class="inline-topics" id="topics-container"></div>
        </section>

        <!-- Trajectory & Impact -->
        <section class="content-block" id="trajectory">
          <h2 class="block-label">Trajectory & Impact</h2>
          <div class="timeline" id="timeline-container"></div>
        </section>

        <section id="research" class="section">
          <div class="section-header">
            <h2 class="section-title">Research & Findings</h2>

            <!-- Seamless Search Bar -->
            <div class="search-container">
              <div class="search-input-wrapper">
                <svg
                  class="search-icon"
                  viewBox="0 0 20 20"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M19 19l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
                <input
                  type="text"
                  id="qa-input"
                  placeholder="Filter by keyword, binder type, or experimental methodology (e.g., LC2, Geocells, CBR)..."
                  autocomplete="off"
                />
              </div>
            </div>
          </div>

          <!-- Results Container -->
          <div id="qa-results" class="qa-results-container"></div>

          <!-- Standard Publications List Below -->
          <div id="publications-list" class="publications-list">
            <!-- Existing publication cards render here -->
          </div>
        </section>

        <!-- Publications -->
        <section class="content-block" id="publications">
          <div class="block-header">
            <h2 class="block-label">Selected Research</h2>
            <div class="filter-pills" id="pub-filters">
              <button class="pill active" data-filter="all">All</button>
              <button class="pill" data-filter="journal">Journals</button>
              <button class="pill" data-filter="conference">Conferences</button>
            </div>
          </div>
          <div class="pub-stream" id="pub-stream"></div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer">
        <p>
          &copy; <span id="year"></span> Dr. Jagdish Gouda. Department of Civil
          Engineering, VNIT Nagpur.
        </p>
      </footer>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast" class="toast-notification">
      Citation copied to clipboard
    </div>

    <script src="constants.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="qa.js"></script>
    <script src="script.js"></script>
  </body>
</html>
